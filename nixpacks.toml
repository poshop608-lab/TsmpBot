[phases.setup]
nixPkgs = [
  "nodejs_20",
  "ffmpeg", "xorg.xvfb", "pulseaudio", "xorg.xrandr",
  "glib", "nss", "nspr", "at-spi2-atk", "cups", "dbus", "libdrm",
  "mesa", "expat", "libxkbcommon", "alsa-lib",
  "xorg.libX11", "xorg.libXcomposite", "xorg.libXdamage", "xorg.libXext",
  "xorg.libXfixes", "xorg.libXrandr", "xorg.libxcb", "xorg.libXcursor",
  "xorg.libXi", "xorg.libXtst", "xorg.libXScrnSaver",
]

[variables]
PLAYWRIGHT_BROWSERS_PATH = "0"
# LD_LIBRARY_PATH for Chromium's Nix-provided shared libs is resolved
# dynamically in start.sh instead of hardcoded here — the /nix/store path
# for each package is content-hashed and a fixed guess (previously
# /root/.nix-profile/lib) didn't actually exist in this image.

[phases.install]
cmds = ["npm install"]

[start]
# Railway was observed running "npm start" regardless of this [start] table
# (confirmed via deploy logs never showing this cmd's output at all), so the
# real boot sequence lives in start.sh, referenced from package.json's start
# script. This entry is kept as a fallback in case that behavior changes.
cmd = "sh start.sh"
