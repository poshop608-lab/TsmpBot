[phases.setup]
nixPkgs = [
  "ffmpeg", "xvfb-run", "pulseaudio", "xorg.xrandr",
  "glib", "nss", "nspr", "at-spi2-atk", "cups", "dbus", "libdrm",
  "mesa", "expat", "libxkbcommon", "alsa-lib",
  "xorg.libX11", "xorg.libXcomposite", "xorg.libXdamage", "xorg.libXext",
  "xorg.libXfixes", "xorg.libXrandr", "xorg.libxcb", "xorg.libXcursor",
  "xorg.libXi", "xorg.libXtst", "xorg.libXScrnSaver",
]

[variables]
PLAYWRIGHT_BROWSERS_PATH = "0"

[phases.install]
cmds = ["npm install", "npx playwright install chromium"]

[start]
# start Xvfb + PulseAudio, then the bot — recorder.js expects DISPLAY=:99
# and a "discordcap" PulseAudio null-sink to already exist.
cmd = "Xvfb :99 -screen 0 1920x1080x24 & sleep 2 && pulseaudio --start --exit-idle-time=-1 && node index.js"
